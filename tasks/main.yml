---
- name: Validate service contract
  include_role:
    name: common.validate_schema

- name: Ensure MariaDB secrets are overridden
  vars:
    mariadb_default_passwords:
      - change-me-root
      - change-me-user
  assert:
    that:
      - mariadb_root_password is defined
      - mariadb_user_password is defined
      - mariadb_root_password | length > 0
      - mariadb_user_password | length > 0
      - mariadb_root_password not in mariadb_default_passwords
      - mariadb_user_password not in mariadb_default_passwords
    fail_msg: >-
      MariaDB root/user credentials must be provided via secrets or vault entries; the default placeholders are insecure.

- name: Validate backup credentials when logical backups are enabled
  when: mariadb_backups.logical.enabled | bool
  vars:
    mariadb_backup_placeholder_values:
      - change-me-restic
      - change-me-access-key
      - change-me-secret
      - s3:s3.amazonaws.com/example-bucket/mariadb
  assert:
    that:
      - mariadb_backup_restic_repository is defined
      - mariadb_backup_restic_password is defined
      - mariadb_backup_aws_access_key_id is defined
      - mariadb_backup_aws_secret_access_key is defined
      - mariadb_backup_restic_repository not in mariadb_backup_placeholder_values
      - mariadb_backup_restic_password not in mariadb_backup_placeholder_values
      - mariadb_backup_aws_access_key_id not in mariadb_backup_placeholder_values
      - mariadb_backup_aws_secret_access_key not in mariadb_backup_placeholder_values
    fail_msg: >-
      Restic repository credentials must be stored in secrets (e.g. Vault or Kubernetes Secret) and cannot use the provided placeholders.

- name: Validate binlog shipping configuration
  when: mariadb_backups.binlog_shipping.enabled | bool
  assert:
    that:
      - mariadb_binlog_s3_path is defined
      - mariadb_binlog_s3_path | length > 0
      - mariadb_binlog_s3_path != 's3://example-bucket/mariadb/binlog'
    fail_msg: >-
      Configure a production S3 path for binlog shipping to guarantee point-in-time recovery.

- name: Initialize resolved schema definitions
  set_fact:
    mariadb_resolved_schemas: []

- name: Validate multi-schema configuration
  when: (mariadb_schemas | length) > 0
  block:
    - name: Ensure schema definitions declare name, user, and credentials
      assert:
        that:
          - item.name is defined
          - item.name | length > 0
          - item.user is defined
          - item.user | length > 0
          - (item.password is defined) or (item.password_var is defined)
        fail_msg: >-
          Each entry in mariadb_schemas must provide name, user, and either password or password_var.
      loop: "{{ mariadb_schemas }}"
      loop_control:
        label: "{{ item.name | default('unnamed') }}"

    - name: Resolve schema credentials
      vars:
        schema_password_var: "{{ item.password_var | default(None) }}"
        schema_password: >-
          {% if item.password is defined %}
          {{ item.password }}
          {% elif schema_password_var is not none %}
          {{ lookup('vars', schema_password_var, default='') }}
          {% else %}
          {% endif %}
      set_fact:
        mariadb_resolved_schemas: "{{ (mariadb_resolved_schemas | default([])) + [ {
          'name': item.name,
          'user': item.user,
          'password': schema_password | trim
        } ] }}"
      loop: "{{ mariadb_schemas }}"
      loop_control:
        label: "{{ item.name }}"
      no_log: true

    - name: Ensure schema passwords are populated
      assert:
        that:
          - item.password | length > 0
        fail_msg: >-
          Passwords referenced by mariadb_schemas must resolve to non-empty values. Verify the password/password_var entries.
      loop: "{{ mariadb_resolved_schemas }}"
      loop_control:
        label: "{{ item.name }}"

- name: Determine target runtimes
  vars:
    candidate_runtimes: "{{ runtime | default(target_runtimes | default(runtime_templates.keys() | list)) }}"
  set_fact:
    service_target_runtimes: "{{ candidate_runtimes if (candidate_runtimes is iterable and candidate_runtimes is not string) else [candidate_runtimes] }}"

- name: Set infrastructure template root
  set_fact:
    infrastructure_template_root: "{{ [role_path | dirname, 'infrastructure', 'templates'] | path_join }}"

- name: Build runtime template map
  set_fact:
    service_runtime_templates: "{{ service_runtime_templates | default({}) | combine({ item.key: ([infrastructure_template_root, item.value] | path_join) }) }}"
  loop: "{{ runtime_templates | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: Ensure requested runtimes are supported
  assert:
    that:
      - runtime_item in service_runtime_templates
    fail_msg: "Runtime {{ runtime_item }} not supported by service {{ service_id }}"
  loop: "{{ service_target_runtimes }}"
  loop_control:
    loop_var: runtime_item

- name: Render and apply runtime(s)
  loop: "{{ service_target_runtimes }}"
  loop_control:
    loop_var: runtime_item
    label: "{{ runtime_item }}"
  block:
    - name: Render runtime {{ runtime_item }}
      include_role:
        name: common.render_runtime
      vars:
        runtime_templates: "{{ service_runtime_templates }}"
        runtime: "{{ runtime_item }}"

    - name: Apply runtime {{ runtime_item }}
      include_role:
        name: common.apply_runtime
      vars:
        runtime: "{{ runtime_item }}"

- name: Wait for MariaDB to accept connections for schema provisioning
  when: (mariadb_resolved_schemas | length) > 0
  community.mysql.mysql_ping:
    login_host: "{{ mariadb_admin_host }}"
    login_port: "{{ mariadb_service_port }}"
    login_user: root
    login_password: "{{ mariadb_root_password }}"
  register: mariadb_ping_result
  retries: 10
  delay: 6
  until: mariadb_ping_result is succeeded

- name: Ensure requested schemas exist
  when: (mariadb_resolved_schemas | length) > 0
  community.mysql.mysql_db:
    name: "{{ item.name }}"
    state: present
    encoding: utf8mb4
    collation: utf8mb4_unicode_ci
    login_host: "{{ mariadb_admin_host }}"
    login_port: "{{ mariadb_service_port }}"
    login_user: root
    login_password: "{{ mariadb_root_password }}"
  loop: "{{ mariadb_resolved_schemas }}"
  loop_control:
    label: "{{ item.name }}"

- name: Ensure schema users exist with scoped privileges
  when: (mariadb_resolved_schemas | length) > 0
  community.mysql.mysql_user:
    name: "{{ item.user }}"
    password: "{{ item.password }}"
    host: "%"
    state: present
    priv: "{{ item.name }}.*:ALL"
    login_host: "{{ mariadb_admin_host }}"
    login_port: "{{ mariadb_service_port }}"
    login_user: root
    login_password: "{{ mariadb_root_password }}"
    update_password: always
  loop: "{{ mariadb_resolved_schemas }}"
  loop_control:
    label: "{{ item.user }}@{{ item.name }}"
  no_log: true

- name: Ensure schema export directory exists
  when: (mariadb_resolved_schemas | length) > 0
  file:
    path: "{{ mariadb_exports_directory }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Render per-schema export files
  when: (mariadb_resolved_schemas | length) > 0
  copy:
    dest: "{{ [mariadb_exports_directory, item.name ~ '.env'] | path_join }}"
    content: |-
      DATABASE_HOST={{ service_ip }}
      DATABASE_PORT={{ mariadb_service_port }}
      DATABASE_NAME={{ item.name }}
      DATABASE_USER={{ item.user }}
    owner: root
    group: root
    mode: "0640"
  loop: "{{ mariadb_resolved_schemas }}"
  loop_control:
    label: "{{ item.name }}"
