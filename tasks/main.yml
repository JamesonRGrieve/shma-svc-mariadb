---
- name: Validate service contract
  include_role:
    name: common.validate_schema

- name: Ensure MariaDB secrets are overridden
  assert:
    that:
      - mariadb_root_password is defined
      - mariadb_user_password is defined
      - mariadb_root_password | length > 0
      - mariadb_user_password | length > 0
      - mariadb_root_password not in [mariadb_root_password_placeholder, mariadb_user_password_placeholder]
      - mariadb_user_password not in [mariadb_root_password_placeholder, mariadb_user_password_placeholder]
      - mariadb_root_password | mariadb_password_is_strong
      - mariadb_user_password | mariadb_password_is_strong
  fail_msg: >-
      MariaDB root/user credentials must be provided via secrets or vault entries; the default placeholders are insecure and passwords must be at least 16 characters with mixed case, digits, and special characters.

- name: Validate firewall CIDR configuration
  assert:
    that:
      - mariadb_allowed_cidrs is defined
      - mariadb_allowed_cidrs | length > 0
    fail_msg: >-
      Define mariadb_allowed_cidrs explicitly to scope database ingress to known networks; the role no longer defaults to broad RFC1918 ranges.

- name: Validate backup credentials when logical backups are enabled
  when: mariadb_backups.logical.enabled | bool
  vars:
    mariadb_backup_placeholder_values:
      - "{{ mariadb_backup_restic_password_placeholder }}"
      - "{{ mariadb_backup_aws_access_key_id_placeholder }}"
      - "{{ mariadb_backup_aws_secret_access_key_placeholder }}"
      - "{{ mariadb_backup_restic_repository_placeholder }}"
  assert:
    that:
      - mariadb_backup_restic_repository is defined
      - mariadb_backup_restic_password is defined
      - mariadb_backup_aws_access_key_id is defined
      - mariadb_backup_aws_secret_access_key is defined
      - mariadb_backup_restic_repository not in mariadb_backup_placeholder_values
      - mariadb_backup_restic_password not in mariadb_backup_placeholder_values
      - mariadb_backup_aws_access_key_id not in mariadb_backup_placeholder_values
      - mariadb_backup_aws_secret_access_key not in mariadb_backup_placeholder_values
  fail_msg: >-
      Restic repository credentials must be stored in secrets (e.g. Vault or Kubernetes Secret) and cannot use the provided placeholders.

- name: Validate backup retention window hierarchy
  when: mariadb_backups.logical.enabled | bool
  vars:
    keep_daily: "{{ mariadb_backups.logical.retention.keep_daily | int }}"
    keep_weekly: "{{ mariadb_backups.logical.retention.keep_weekly | int }}"
    keep_monthly: "{{ mariadb_backups.logical.retention.keep_monthly | int }}"
  assert:
    that:
      - keep_monthly >= keep_weekly
      - keep_weekly >= keep_daily
  fail_msg: >-
      Logical backup retention must satisfy keep_monthly >= keep_weekly >= keep_daily to avoid overlapping pruning windows.

- name: Perform Restic repository preflight check
  when: mariadb_backups.logical.enabled | bool
  tags:
    - verify-backups
  command:
    argv:
      - restic
      - snapshots
      - --repo
      - "{{ mariadb_backups.logical.restic_repository | default(mariadb_backup_restic_repository) }}"
  environment:
    RESTIC_PASSWORD: "{{ mariadb_backup_restic_password }}"
    AWS_ACCESS_KEY_ID: "{{ mariadb_backup_aws_access_key_id }}"
    AWS_SECRET_ACCESS_KEY: "{{ mariadb_backup_aws_secret_access_key }}"
  register: mariadb_restic_preflight
  changed_when: false
  no_log: true

- name: Validate binlog shipping configuration
  when: mariadb_backups.binlog_shipping.enabled | bool
  assert:
    that:
      - mariadb_binlog_s3_path is defined
      - mariadb_binlog_s3_path | length > 0
      - mariadb_binlog_s3_path != mariadb_binlog_s3_path_placeholder
  fail_msg: >-
      Configure a production S3 path for binlog shipping to guarantee point-in-time recovery.

- name: Validate binlog shipping credentials
  when: mariadb_backups.binlog_shipping.enabled | bool
  assert:
    that:
      - mariadb_backup_aws_access_key_id is defined
      - mariadb_backup_aws_secret_access_key is defined
      - mariadb_backup_aws_access_key_id not in [mariadb_backup_aws_access_key_id_placeholder]
      - mariadb_backup_aws_secret_access_key not in [mariadb_backup_aws_secret_access_key_placeholder]
  fail_msg: >-
      Binlog shipping requires dedicated AWS credentials; provide non-placeholder access and secret keys.

- name: Parse binlog shipping destination
  when: mariadb_backups.binlog_shipping.enabled | bool
  set_fact:
    mariadb_binlog_s3_components: "{{ mariadb_binlog_s3_path | mariadb_parse_s3_url }}"

- name: Generate binlog shipping preflight object key
  when: mariadb_backups.binlog_shipping.enabled | bool
  set_fact:
    mariadb_binlog_preflight_object: "{{ mariadb_binlog_s3_components.prefix | mariadb_preflight_key }}"

- name: Upload binlog shipping preflight object
  when: mariadb_backups.binlog_shipping.enabled | bool
  amazon.aws.s3_object:
    bucket: "{{ mariadb_binlog_s3_components.bucket }}"
    object: "{{ mariadb_binlog_preflight_object }}"
    content: mariadb binlog shipping preflight validation
    mode: put
    access_key: "{{ mariadb_backup_aws_access_key_id }}"
    secret_key: "{{ mariadb_backup_aws_secret_access_key }}"
    region: "{{ mariadb_backup_aws_region | default(omit) }}"
  delegate_to: localhost
  run_once: true
  register: mariadb_binlog_preflight_upload
  changed_when: false
  no_log: true

- name: Remove binlog shipping preflight object
  when: mariadb_backups.binlog_shipping.enabled | bool
  amazon.aws.s3_object:
    bucket: "{{ mariadb_binlog_s3_components.bucket }}"
    object: "{{ mariadb_binlog_preflight_object }}"
    mode: delete
    access_key: "{{ mariadb_backup_aws_access_key_id }}"
    secret_key: "{{ mariadb_backup_aws_secret_access_key }}"
    region: "{{ mariadb_backup_aws_region | default(omit) }}"
  delegate_to: localhost
  run_once: true
  changed_when: false
  no_log: true


- name: Normalize schema definitions
  set_fact:
    mariadb_validated_schemas: "{{ mariadb_schemas | default([]) | mariadb_normalize_schemas(mariadb_schema_default_state, mariadb_reserved_schema_names, mariadb_schema_privilege_levels) }}"

- name: Resolve schema credentials and privileges
  set_fact:
    mariadb_resolved_schemas: "{{ mariadb_validated_schemas | mariadb_resolve_schemas(vars) }}"
  no_log: true

- name: Partition schemas by desired state
  when: (mariadb_resolved_schemas | length) > 0
  set_fact:
    mariadb_present_schemas: "{{ mariadb_resolved_schemas | selectattr('state', 'equalto', 'present') | list }}"
    mariadb_absent_schemas: "{{ mariadb_resolved_schemas | selectattr('state', 'equalto', 'absent') | list }}"

- name: Determine target runtimes
  vars:
    candidate_runtimes: "{{ runtime | default(target_runtimes | default(runtime_templates.keys() | list)) }}"
  set_fact:
    service_target_runtimes: "{{ candidate_runtimes if (candidate_runtimes is iterable and candidate_runtimes is not string) else [candidate_runtimes] }}"

- name: Set infrastructure template root
  set_fact:
    infrastructure_template_root: "{{ [role_path | dirname, 'infrastructure', 'templates'] | path_join }}"

- name: Build runtime template map
  set_fact:
    service_runtime_templates: "{{ service_runtime_templates | default({}) | combine({ item.key: ([infrastructure_template_root, item.value] | path_join) }) }}"
  loop: "{{ runtime_templates | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: Ensure requested runtimes are supported
  assert:
    that:
      - runtime_item in service_runtime_templates
    fail_msg: "Runtime {{ runtime_item }} not supported by service {{ service_id }}"
  loop: "{{ service_target_runtimes }}"
  loop_control:
    loop_var: runtime_item

- name: Render and apply runtime(s)
  loop: "{{ service_target_runtimes }}"
  loop_control:
    loop_var: runtime_item
    label: "{{ runtime_item }}"
  block:
    - name: Render runtime {{ runtime_item }}
      include_role:
        name: common.render_runtime
      vars:
        runtime_templates: "{{ service_runtime_templates }}"
        runtime: "{{ runtime_item }}"

    - name: Apply runtime {{ runtime_item }}
      include_role:
        name: common.apply_runtime
      vars:
        runtime: "{{ runtime_item }}"

- name: Wait for MariaDB to accept connections
  community.mysql.mysql_ping:
    login_host: "{{ mariadb_admin_host }}"
    login_port: "{{ mariadb_service_port }}"
    login_user: root
    login_password: "{{ mariadb_root_password }}"
  register: mariadb_ping_result
  retries: 10
  delay: 6
  until: mariadb_ping_result is succeeded

- name: Normalize root host allow and deny lists
  set_fact:
    mariadb_root_allowed_hosts_resolved: >-
      {{ (mariadb_root_allowed_hosts | default([]))
         | reject('equalto', None)
         | reject('equalto', '')
         | list
         | unique }}
    mariadb_root_disallowed_hosts_resolved: >-
      {{ (mariadb_root_disallowed_hosts | default([]))
         | reject('equalto', None)
         | reject('equalto', '')
         | list
         | unique }}

- name: Query existing root account hosts
  community.mysql.mysql_query:
    query: "SELECT host FROM mysql.user WHERE user = 'root'"
    login_host: "{{ mariadb_admin_host }}"
    login_port: "{{ mariadb_service_port }}"
    login_user: root
    login_password: "{{ mariadb_root_password }}"
  register: mariadb_root_host_query
  changed_when: false
  no_log: true

- name: Normalize existing root hosts
  set_fact:
    mariadb_root_existing_hosts: "{{ (mariadb_root_host_query.query_result | default([])) | map(attribute='rows') | list | flatten }}"

- name: Ensure root accounts are scoped to approved hosts
  when: (mariadb_root_allowed_hosts_resolved | length) > 0
  community.mysql.mysql_user:
    name: root
    host: "{{ item }}"
    password: "{{ mariadb_root_password }}"
    priv: "*.*:ALL,GRANT"
    state: present
    update_password: always
    login_host: "{{ mariadb_admin_host }}"
    login_port: "{{ mariadb_service_port }}"
    login_user: root
    login_password: "{{ mariadb_root_password }}"
  loop: "{{ mariadb_root_allowed_hosts_resolved }}"
  loop_control:
    label: "root@{{ item }}"
  no_log: true

- name: Remove remote root accounts
  vars:
    mariadb_root_hosts_to_remove: "{{ (((mariadb_root_existing_hosts | default([])) | difference(mariadb_root_allowed_hosts_resolved))
      | union(mariadb_root_disallowed_hosts_resolved | difference(mariadb_root_allowed_hosts_resolved))) | unique }}"
  when: (mariadb_root_hosts_to_remove | length) > 0
  community.mysql.mysql_user:
    name: root
    host: "{{ item }}"
    state: absent
    login_host: "{{ mariadb_admin_host }}"
    login_port: "{{ mariadb_service_port }}"
    login_user: root
    login_password: "{{ mariadb_root_password }}"
  loop: "{{ mariadb_root_hosts_to_remove }}"
  loop_control:
    label: "root@{{ item }}"
  no_log: true

- name: Discover default test schemas
  when: mariadb_remove_test_database | bool
  community.mysql.mysql_query:
    query: "SHOW DATABASES LIKE 'test%'"
    login_host: "{{ mariadb_admin_host }}"
    login_port: "{{ mariadb_service_port }}"
    login_user: root
    login_password: "{{ mariadb_root_password }}"
  register: mariadb_test_database_query
  changed_when: false

- name: Normalize test schemas slated for removal
  when: mariadb_remove_test_database | bool
  set_fact:
    mariadb_test_databases: "{{ (mariadb_test_database_query.query_result | default([])) | map(attribute='rows') | list | flatten }}"

- name: Remove default test databases
  when:
    - mariadb_remove_test_database | bool
    - (mariadb_test_databases | default([])) | length > 0
  community.mysql.mysql_db:
    name: "{{ item }}"
    state: absent
    login_host: "{{ mariadb_admin_host }}"
    login_port: "{{ mariadb_service_port }}"
    login_user: root
    login_password: "{{ mariadb_root_password }}"
  loop: "{{ mariadb_test_databases }}"
  loop_control:
    label: "{{ item }}"

- name: Ensure requested schemas exist
  when: (mariadb_present_schemas | default([])) | length > 0
  community.mysql.mysql_db:
    name: "{{ item.name }}"
    state: present
    encoding: utf8mb4
    collation: utf8mb4_unicode_ci
    login_host: "{{ mariadb_admin_host }}"
    login_port: "{{ mariadb_service_port }}"
    login_user: root
    login_password: "{{ mariadb_root_password }}"
  loop: "{{ mariadb_present_schemas }}"
  loop_control:
    label: "{{ item.name }}"

- name: Drop schemas marked absent
  when: (mariadb_absent_schemas | default([])) | length > 0
  community.mysql.mysql_db:
    name: "{{ item.name }}"
    state: absent
    login_host: "{{ mariadb_admin_host }}"
    login_port: "{{ mariadb_service_port }}"
    login_user: root
    login_password: "{{ mariadb_root_password }}"
  loop: "{{ mariadb_absent_schemas }}"
  loop_control:
    label: "{{ item.name }}"

- name: Ensure schema users exist with scoped privileges
  when: (mariadb_present_schemas | default([])) | length > 0
  vars:
    schema_item: "{{ item.0 }}"
    user_item: "{{ item.1 }}"
    privilege_list: "{{ user_item.privileges | unique }}"
    privilege_clause: "{{ privilege_list | join(',') }}{{ ',GRANT' if user_item.grant_option | bool else '' }}"
  community.mysql.mysql_user:
    name: "{{ user_item.name }}"
    password: "{{ user_item.password }}"
    host: "%"
    state: present
    priv: "{{ schema_item.name }}.*:{{ privilege_clause }}"
    login_host: "{{ mariadb_admin_host }}"
    login_port: "{{ mariadb_service_port }}"
    login_user: root
    login_password: "{{ mariadb_root_password }}"
    update_password: always
  loop: "{{ mariadb_present_schemas | subelements('users') }}"
  loop_control:
    label: "{{ user_item.name }}@{{ schema_item.name }}"
  no_log: true

- name: Remove users for dropped schemas
  when: (mariadb_absent_schemas | default([])) | length > 0
  vars:
    schema_item: "{{ item.0 }}"
    user_item: "{{ item.1 }}"
  community.mysql.mysql_user:
    name: "{{ user_item.name }}"
    host: "%"
    state: absent
    login_host: "{{ mariadb_admin_host }}"
    login_port: "{{ mariadb_service_port }}"
    login_user: root
    login_password: "{{ mariadb_root_password }}"
  loop: "{{ mariadb_absent_schemas | subelements('users') }}"
  loop_control:
    label: "{{ user_item.name }}@{{ schema_item.name }}"
  no_log: true

- name: Validate schema export delivery mode
  assert:
    that:
      - mariadb_exports_delivery in ['stdout', 'configmap', 'secret', 'none']
  fail_msg: >-
      mariadb_exports_delivery must be one of stdout, configmap, secret, or none.

- name: Build schema export payloads
  when:
    - (mariadb_resolved_schemas | default([])) | length > 0
    - mariadb_exports_delivery != 'none'
  set_fact:
    mariadb_schema_exports: "{{ mariadb_resolved_schemas | mariadb_schema_exports(service_id, service_ip, mariadb_service_port, version, mariadb_exports_include_credentials) }}"
  no_log: "{{ mariadb_exports_include_credentials | bool }}"

- name: Build schema export mapping
  when: (mariadb_schema_exports | default([])) | length > 0
  set_fact:
    mariadb_schema_export_map: "{{ mariadb_schema_exports | mariadb_schema_export_map }}"
  no_log: "{{ mariadb_exports_include_credentials | bool }}"

- name: Emit schema exports to stdout
  when:
    - (mariadb_schema_exports | default([])) | length > 0
    - mariadb_exports_delivery == 'stdout'
  debug:
    msg: |-
      {{ item.key }}
      {{ item.content | trim }}
  loop: "{{ mariadb_schema_exports }}"
  loop_control:
    label: "{{ item.key }}"
  no_log: "{{ mariadb_exports_include_credentials | bool }}"

- name: Publish schema exports as ConfigMap
  when:
    - (mariadb_schema_exports | default([])) | length > 0
    - mariadb_exports_delivery == 'configmap'
  set_fact:
    exports: "{{ exports | default({}) | combine({'configmaps': (exports.configmaps | default([])) + [ { 'name': mariadb_exports_configmap_name, 'data': mariadb_schema_export_map } ]}, recursive=True) }}"
  no_log: "{{ mariadb_exports_include_credentials | bool }}"

- name: Publish schema exports as Secret
  when:
    - (mariadb_schema_exports | default([])) | length > 0
    - mariadb_exports_delivery == 'secret'
  set_fact:
    exports: "{{ exports | default({}) | combine({'secrets': (exports.secrets | default([])) + [ { 'name': mariadb_exports_secret_name, 'stringData': mariadb_schema_export_map } ]}, recursive=True) }}"
  no_log: true
